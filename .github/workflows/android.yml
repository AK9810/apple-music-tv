name: Android APK

on:
  push:
    # `main` is the only integration branch: every push builds and refreshes the rolling
    # `dev` pre-release (the publish steps below are gated on refs/heads/main).
    # A version-like tag (v1.4, 1.4, …) additionally publishes a STABLE release — the
    # branches and tags filters are OR'd for push events. The `dev` tag deliberately does
    # NOT match these patterns, so recreating it never re-triggers this workflow.
    # Pushing to main with a NEW versionName in app/build.gradle.kts auto-creates the
    # matching `v<version>` tag and stable release, so the two can't drift apart.
    branches: [ main ]
    tags: [ 'v[0-9]*', '[0-9]*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Needed by the "Publish dev release" step below — the default GITHUB_TOKEN is
    # read-only, which fails with "Resource not accessible by integration".
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so the changelog step can diff this push's commit range.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        # v3 targets Node 20, which runners now force onto Node 24 — the action
        # aborts before doing anything, failing the build at this step. v4 is the
        # Node 24 release; its inputs are unchanged for our usage.
        uses: android-actions/setup-android@v4

      - name: Provide default proxy URL for CI build
        run: echo "proxyBaseUrl=http://10.0.2.2:3000/" > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew :app:test --no-daemon --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # Copy the Gradle output to a version-carrying filename, so release downloads are
      # distinguishable instead of every release handing out the same "app-debug.apk":
      #   tag push (stable)  → AppleMusicTV-v1.5.apk
      #   main / PR (dev)    → AppleMusicTV-1.5-dev-<sha>.apk
      # Dev builds also get a fixed alias (AppleMusicTV-dev.apk) because the rolling dev
      # release is deleted and re-created on every push, so a link can't pin a sha.
      # Stable builds get the same treatment as AppleMusicTV.apk: the README's download badge
      # links to releases/latest/download/AppleMusicTV.apk, which needs no edit per release.
      # A main push also stages AppleMusicTV-v<version>.apk, for the version-bump release below.
      - name: Stage versioned APK
        id: apk
        run: |
          mkdir -p dist
          SRC=app/build/outputs/apk/debug/app-debug.apk
          VERSION=$(sed -n 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            NAME="AppleMusicTV-${GITHUB_REF_NAME}.apk"
            STABLE="$NAME"
          else
            NAME="AppleMusicTV-${VERSION:-unknown}-dev-${GITHUB_SHA:0:7}.apk"
            STABLE="AppleMusicTV-v${VERSION:-unknown}.apk"
            cp "$SRC" dist/AppleMusicTV-dev.apk
          fi
          cp "$SRC" "dist/$NAME"
          # `cp file file` exits non-zero ("are the same file") and `run:` is bash -e.
          if [[ "$STABLE" != "$NAME" ]]; then cp "$SRC" "dist/$STABLE"; fi
          cp "$SRC" dist/AppleMusicTV.apk
          echo "version=${VERSION:-unknown}" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "stable=$STABLE" >> "$GITHUB_OUTPUT"
          echo "base=${NAME%.apk}" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.base }}
          path: android/dist/${{ steps.apk.outputs.name }}
          if-no-files-found: error

      # Delete the previous dev release + tag first, so the re-created one gets a fresh
      # creation date and sorts to the TOP of the Releases list (GitHub orders by created_at;
      # an updated-in-place release keeps its old date and sinks below newer tags).
      - name: Remove old dev release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: gh release delete dev --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publish a rolling "dev" release on every push to main.
      # Anyone with the repo URL can download the APK — no login required.
      - name: Publish dev release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: "Latest dev build"
          # The `commit <sha>` line is REQUIRED: the in-app Beta updater greps it
          # (UpdateChecker.parseRelease) to tell this rolling build apart from the
          # installed one. Without it, Beta never offers CI builds.
          body: |
            Auto-built from `main`. Sideload: `adb install -r ${{ steps.apk.outputs.name }}`

            commit ${{ github.sha }}
          prerelease: true
          files: |
            android/dist/${{ steps.apk.outputs.name }}
            android/dist/AppleMusicTV-dev.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Keep the stable release in lockstep with `main`: if this push changed versionName,
      # no release exists for it yet, so cut one now. Without this, a bumped version merged
      # to main silently kept pointing at the previous stable release and the in-app stable
      # updater (which reads /releases/latest) never saw it.
      # It runs in THIS workflow run, not by pushing a tag and letting the tag path re-trigger:
      # a tag pushed with GITHUB_TOKEN does not start a new workflow run.
      - name: Check for an existing release of this version
        id: version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          V="${{ steps.apk.outputs.version }}"
          # Guard the sed-parse failure path: never create a "vunknown" release.
          if [[ ! "$V" =~ ^[0-9] ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Could not parse versionName — skipping the version release."
          elif gh release view "v$V" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v$V already exists — not cutting another."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No release for v$V yet — publishing it."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release for a new version on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.version.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          # Creates the tag at this commit if it doesn't exist yet, so `main` and the
          # release always name the same build.
          tag_name: v${{ steps.apk.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: "Apple Music TV v${{ steps.apk.outputs.version }}"
          # Same notes source as the tag path below: RELEASE_NOTES.md is rewritten as part
          # of every version cut, and its heading should match the version being released.
          body_path: RELEASE_NOTES.md
          prerelease: false
          files: |
            android/dist/${{ steps.apk.outputs.stable }}
            android/dist/AppleMusicTV.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A pushed version tag publishes a STABLE (non-prerelease) release. The in-app
      # stable channel resolves /releases/latest, which only ever returns non-prereleases,
      # so a version tag without this step is invisible to the updater.
      # Kept for explicit/manual tag pushes (and re-releasing an old tag); a normal version
      # bump merged to main is already published by the step above.
      - name: Publish stable release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Apple Music TV ${{ github.ref_name }}"
          # Release notes come from RELEASE_NOTES.md (repo root) — rewrite it as part of
          # every version cut. Falls back to the inline body if the file can't be read.
          body: |
            Stable build of `${{ github.ref_name }}`. Sideload: `adb install -r ${{ steps.apk.outputs.name }}`

            commit ${{ github.sha }}
          body_path: RELEASE_NOTES.md
          prerelease: false
          files: |
            android/dist/${{ steps.apk.outputs.name }}
            android/dist/AppleMusicTV.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
